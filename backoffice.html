<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>หลังร้าน</title>
<link rel="manifest" href="manifest-backoffice.json">
<meta name="theme-color" content="#161311">
<link rel="apple-touch-icon" href="icon-backoffice-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1712; --paper:#161311; --char:#242019; --char-2:#2e2820;
    --turmeric:#f0a93a; --chili:#e2492c; --leaf:#7a9a4a;
    --cream:#f3ead9; --line:#3a332a; --dim:#9c9284;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--cream);font-family:'Sarabun',sans-serif;min-height:100vh;padding-bottom:24px;}
  input,select{font-family:'Sarabun',sans-serif;}

  header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 18px 0;}
  h1{font-family:'Kanit',sans-serif;font-weight:800;font-size:20px;margin:0 0 2px;}
  .sub{color:var(--dim);font-size:12px;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:inline-block;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .tabbar{display:flex;gap:6px;}
  .tab-btn{
    flex:1;text-align:center;font-family:'Kanit',sans-serif;font-weight:600;font-size:13.5px;
    padding:11px 4px;background:none;border:none;color:var(--dim);border-bottom:2px solid transparent;
  }
  .tab-btn.active{color:var(--turmeric);border-color:var(--turmeric);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---- order tab (reuses kitchen styles) ---- */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .f-chip{
    flex:0 0 auto;font-family:'Kanit',sans-serif;font-weight:600;font-size:13.5px;
    padding:7px 14px;border-radius:999px;background:var(--char);color:#c9beac;
    border:1px solid var(--line);white-space:nowrap;
  }
  .f-chip .n{opacity:.7;margin-left:4px;}
  .f-chip.active{background:var(--turmeric);color:#241a06;border-color:var(--turmeric);}

  main.order-main{padding:8px 18px 0;display:flex;flex-direction:column;gap:12px;}
  .order-card{background:var(--char);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;}
  .order-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
  .order-card.st-pending::before{background:var(--chili);}
  .order-card.st-cooking::before{background:var(--turmeric);}
  .order-card.st-served::before{background:var(--leaf);}
  .order-card.st-cancelled{opacity:.5;}
  .order-card.st-cancelled::before{background:var(--dim);}
  .oc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .table-tag{font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;color:var(--turmeric);display:flex;align-items:center;gap:6px;}
  .time-tag{font-size:12px;color:var(--dim);}
  .status-badge{font-family:'Kanit',sans-serif;font-weight:600;font-size:11.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .st-pending .status-badge{background:rgba(226,73,44,.18);color:#ff8a6b;}
  .st-cooking .status-badge{background:rgba(240,169,58,.18);color:var(--turmeric);}
  .st-served .status-badge{background:rgba(122,154,74,.18);color:#a9c97f;}
  .st-cancelled .status-badge{background:rgba(156,146,132,.18);color:var(--dim);}
  .items-list{margin:8px 0 10px;display:flex;flex-direction:column;gap:4px;}
  .item-row{display:flex;justify-content:space-between;font-size:14px;}
  .item-row .qty{color:var(--turmeric);font-weight:600;margin-right:6px;}
  .item-row .name{flex:1;}
  .item-row .price{color:var(--dim);font-size:13px;}
  .oc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;}
  .total{font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;}
  .action-btn{font-family:'Kanit',sans-serif;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;border:none;}
  .action-btn.to-cooking{background:var(--turmeric);color:#241a06;}
  .action-btn.to-served{background:var(--leaf);color:#12180a;}
  .action-btn.done{background:var(--char-2);color:var(--dim);}
  .action-btn:active{transform:scale(.96);}
  .cancel-btn{font-family:'Kanit',sans-serif;font-weight:600;font-size:12.5px;background:transparent;color:var(--chili);border:1px solid var(--chili);padding:8px 12px;border-radius:10px;margin-right:8px;}
  .cancel-btn:active{transform:scale(.96);}
  .action-group{display:flex;align-items:center;}
  .empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;}
  .empty .big{font-size:34px;margin-bottom:8px;}

  /* ---- PIN gate (for menu/settings tabs) ---- */
  #pinOverlay{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;}
  #pinOverlay.show{display:flex;}
  #pinOverlay h2{font-family:'Kanit',sans-serif;font-weight:700;font-size:18px;margin:0;text-align:center;}
  .pin-display{display:flex;gap:12px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:transparent;}
  .pin-dot.filled{background:var(--turmeric);border-color:var(--turmeric);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;width:100%;}
  .pin-key{font-family:'Kanit',sans-serif;font-weight:700;font-size:22px;background:var(--char);color:var(--cream);border:1px solid var(--line);border-radius:14px;padding:18px 0;}
  .pin-key:active{transform:scale(.95);}
  .pin-key.clear{color:var(--chili);font-size:14px;}
  .pin-error{color:var(--chili);font-size:13px;height:16px;}
  .pin-cancel{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;}

  /* ---- menu tab ---- */
  main.menu-main, main.settings-main{padding:14px 18px 40px;}
  .add-btn{font-family:'Kanit',sans-serif;font-weight:700;font-size:13.5px;background:var(--turmeric);color:#241a06;border:none;padding:10px 16px;border-radius:10px;margin:12px 18px 0;display:inline-block;}
  .add-btn:active{transform:scale(.96);}
  .cat-group{margin-bottom:18px;}
  .cat-title{font-family:'Kanit',sans-serif;font-weight:700;font-size:14px;color:var(--dim);margin:0 0 8px 2px;}
  .menu-item{background:var(--char);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;}
  .mi-thumb{width:48px;height:48px;border-radius:10px;background:var(--char-2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;object-fit:cover;}
  .mi-info{flex:1;min-width:0;}
  .mi-name{font-family:'Kanit',sans-serif;font-weight:600;font-size:14.5px;}
  .mi-meta{font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .mi-profit{color:var(--leaf);}
  .mi-stock{color:var(--turmeric);}
  .mi-stock.low{color:var(--chili);}
  .mi-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .avail-toggle{font-family:'Kanit',sans-serif;font-weight:600;font-size:11px;padding:4px 10px;border-radius:999px;border:none;}
  .avail-toggle.on{background:rgba(122,154,74,.2);color:#a9c97f;}
  .avail-toggle.off{background:rgba(226,73,44,.2);color:#ff8a6b;}
  .icon-btn{background:none;border:none;color:var(--dim);font-size:16px;padding:4px;}

  .overlay{position:fixed;inset:0;background:rgba(10,8,6,.65);z-index:40;display:none;}
  .overlay.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-radius:20px 20px 0 0;max-height:90vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease;border-top:1px solid var(--line);}
  .sheet.show{transform:translateY(0);}
  .sheet-head{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
  .sheet-head h2{font-family:'Kanit',sans-serif;font-size:16px;margin:0;}
  .sheet-close{background:none;border:none;color:var(--dim);font-size:20px;padding:4px;}
  .sheet-body{overflow-y:auto;padding:16px 18px;flex:1;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-family:'Kanit',sans-serif;}
  .field input, .field select{width:100%;background:var(--char);border:1px solid var(--line);border-radius:10px;color:var(--cream);font-size:14.5px;padding:11px 12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .profit-preview{background:var(--char);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;margin-bottom:14px;color:var(--dim);}
  .profit-preview b{color:var(--leaf);font-family:'Kanit',sans-serif;}
  .save-btn{width:100%;background:var(--turmeric);color:#241a06;border:none;font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;padding:14px;border-radius:12px;margin-bottom:8px;}
  .delete-btn{width:100%;background:transparent;color:var(--chili);border:1px solid var(--chili);font-family:'Kanit',sans-serif;font-weight:600;font-size:13.5px;padding:12px;border-radius:12px;margin-bottom:10px;}

  /* ---- settings tab ---- */
  .settings-card{background:var(--char);border:1px solid var(--line);border-radius:16px;padding:18px;}
  .settings-card .field{margin-bottom:16px;}

  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-40px);background:var(--leaf);color:#12180a;font-family:'Kanit',sans-serif;font-weight:600;padding:10px 20px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:all .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>หลังร้าน</h1>
  <p class="sub"><span class="live-dot"></span> อัปเดตแบบเรียลไทม์ · <span id="soundStatus">🔕 แตะหน้าจอเพื่อเปิดเสียงเตือน</span></p>
  <div class="tabbar">
    <button class="tab-btn active" data-tab="order">🍽️ ออเดอร์</button>
    <button class="tab-btn" data-tab="menu">📋 จัดการเมนู</button>
    <button class="tab-btn" data-tab="settings">⚙️ ตั้งค่าร้าน</button>
  </div>
</header>

<!-- ===================== ORDER TAB ===================== -->
<div class="tab-panel active" id="panel-order">
  <nav class="filters" id="filters"></nav>
  <main class="order-main" id="orderList"></main>
</div>

<!-- ===================== MENU TAB ===================== -->
<div class="tab-panel" id="panel-menu">
  <button class="add-btn" id="addBtn">+ เพิ่มเมนู</button>
  <main class="menu-main" id="menuList"></main>
</div>

<!-- ===================== SETTINGS TAB ===================== -->
<div class="tab-panel" id="panel-settings">
  <main class="settings-main">
    <div class="settings-card">
      <div class="field"><label>ชื่อเจ้าของกิจการ</label><input type="text" id="setOwnerName" placeholder="ชื่อ-นามสกุลเจ้าของร้าน"></div>
      <div class="field"><label>เลขประจำตัวประชาชน</label><input type="text" id="setIdCard" placeholder="เลข 13 หลัก"></div>
      <div class="field"><label>ชื่อร้าน / สถานประกอบการ</label><input type="text" id="setShopName" placeholder="เช่น ร้านบ้านนา"></div>
      <div class="field"><label>ที่อยู่</label><input type="text" id="setAddress" placeholder="ที่อยู่ร้าน"></div>
      <div class="field"><label>เบอร์โทร</label><input type="text" id="setPhone" placeholder="เบอร์ติดต่อร้าน"></div>
      <div class="field"><label>เลขประจำตัวผู้เสียภาษี (ถ้ามี)</label><input type="text" id="setTaxId" placeholder="เลข 13 หลัก"></div>
      <div class="field"><label>ข้อความท้ายใบเสร็จ</label><input type="text" id="setFooter" placeholder="เช่น ขอบคุณที่ใช้บริการ"></div>
      <button class="save-btn" id="saveSettingsBtn">บันทึกข้อมูลร้าน</button>
    </div>
  </main>
</div>

<!-- PIN gate overlay -->
<div id="pinOverlay">
  <h2 id="pinTitle">🔒 ใส่รหัสผ่าน</h2>
  <div class="pin-display" id="pinDisplay"></div>
  <div class="pin-error" id="pinError"></div>
  <div class="pin-pad">
    <button class="pin-key" data-k="1">1</button>
    <button class="pin-key" data-k="2">2</button>
    <button class="pin-key" data-k="3">3</button>
    <button class="pin-key" data-k="4">4</button>
    <button class="pin-key" data-k="5">5</button>
    <button class="pin-key" data-k="6">6</button>
    <button class="pin-key" data-k="7">7</button>
    <button class="pin-key" data-k="8">8</button>
    <button class="pin-key" data-k="9">9</button>
    <button class="pin-key clear" data-k="clear">ล้าง</button>
    <button class="pin-key" data-k="0">0</button>
    <button class="pin-key clear" data-k="back">⌫</button>
  </div>
  <button class="pin-cancel" id="pinCancelBtn">กลับไปหน้าออเดอร์</button>
</div>

<!-- menu add/edit sheet -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2 id="sheetTitle">เพิ่มเมนูใหม่</h2>
    <button class="sheet-close" id="sheetClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field"><label>ชื่อเมนู</label><input type="text" id="fName" placeholder="เช่น ส้มตำไทย"></div>
    <div class="field"><label>หมวดหมู่</label><input type="text" id="fCategory" list="catList" placeholder="เช่น ยำ/ส้มตำ"><datalist id="catList"></datalist></div>
    <div class="row2">
      <div class="field"><label>ราคาต้นทุน (บาท)</label><input type="number" id="fCost" placeholder="0"></div>
      <div class="field"><label>ราคาขาย (บาท)</label><input type="number" id="fPrice" placeholder="0"></div>
    </div>
    <div class="field"><label>จำนวนสต็อก</label><input type="number" id="fStock" placeholder="เว้นว่างได้ถ้าไม่นับสต็อก"></div>
    <div class="field"><label>ลิงก์รูปภาพ (ถ้ามี)</label><input type="text" id="fImage" placeholder="https://..."></div>
    <div class="profit-preview"><span>กำไรต่อชิ้น</span><b id="profitPreview">0 บาท</b></div>
    <button class="save-btn" id="saveBtn">บันทึก</button>
    <button class="delete-btn" id="deleteBtn" style="display:none;">ลบเมนูนี้</button>
  </div>
</div>

<div class="toast" id="toast">บันทึกแล้ว 🎉</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
const ADMIN_PIN = "1234"; // เปลี่ยนรหัสได้ตรงนี้

const firebaseConfig = {
  apiKey: "AIzaSyDAp28CroK5j_iE8LQXngUXXs1DaASqpE8",
  authDomain: "shop-order-system-62765.firebaseapp.com",
  databaseURL: "https://shop-order-system-62765-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shop-order-system-62765",
  storageBucket: "shop-order-system-62765.firebasestorage.app",
  messagingSenderId: "777357129637",
  appId: "1:777357129637:web:776e6c6dca05db99909a4c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= TAB SWITCHING =================
let adminUnlocked = false;
let pendingTab = null;

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{
    const tab = btn.dataset.tab;
    if((tab === 'menu' || tab === 'settings') && !adminUnlocked){
      pendingTab = tab;
      openPinGate();
      return;
    }
    switchTab(tab);
  };
});

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-' + tab));
}

function openPinGate(){
  pinEntry = '';
  renderPinDots();
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinOverlay').classList.add('show');
}
document.getElementById('pinCancelBtn').onclick = ()=>{
  document.getElementById('pinOverlay').classList.remove('show');
  pendingTab = null;
};

let pinEntry = "";
function renderPinDots(){
  const disp = document.getElementById('pinDisplay');
  disp.innerHTML = '';
  for(let i=0;i<4;i++){
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < pinEntry.length ? ' filled' : '');
    disp.appendChild(d);
  }
}
document.querySelectorAll('.pin-key').forEach(btn=>{
  btn.onclick = ()=>{
    const k = btn.dataset.k;
    document.getElementById('pinError').textContent = '';
    if(k === 'clear'){ pinEntry = ''; }
    else if(k === 'back'){ pinEntry = pinEntry.slice(0,-1); }
    else if(pinEntry.length < 4){ pinEntry += k; }
    renderPinDots();
    if(pinEntry.length === 4){
      if(pinEntry === ADMIN_PIN){
        adminUnlocked = true;
        document.getElementById('pinOverlay').classList.remove('show');
        if(pendingTab){ switchTab(pendingTab); pendingTab = null; }
      } else {
        document.getElementById('pinError').textContent = 'รหัสไม่ถูกต้อง';
        setTimeout(()=>{ pinEntry=''; renderPinDots(); }, 500);
      }
    }
  };
});

// ================= ORDER TAB (kitchen logic) =================
let orders = {};
let activeFilter = 'active';
const statusLabel = { pending:'รอทำ', cooking:'กำลังทำ', served:'เสร็จแล้ว', cancelled:'ยกเลิก' };

let audioCtx = null;
let soundReady = false;
function unlockSound(){
  if(soundReady) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    soundReady = true;
    document.getElementById('soundStatus').textContent = '🔔 เสียงพร้อม';
  }catch(e){}
}
document.addEventListener('click', unlockSound, { once:true });

function speakThai(text){
  if(!('speechSynthesis' in window)) return;
  try{
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'th-TH';
    utter.rate = 0.95;
    utter.volume = 1;
    speechSynthesis.speak(utter);
  }catch(e){}
}

function playDing(){
  if(!soundReady || !audioCtx) return;
  const t = audioCtx.currentTime;
  [784, 1046, 1318].forEach((freq, i)=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t + i*0.22);
    gain.gain.exponentialRampToValueAtTime(0.9, t + i*0.22 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + i*0.22 + 0.65);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t + i*0.22);
    osc.stop(t + i*0.22 + 0.7);
  });
}

let knownOrderIds = new Set();
let firstLoad = true;
db.ref('orders').on('value', snap=>{
  const newOrders = snap.val() || {};
  if(!firstLoad){
    Object.entries(newOrders).forEach(([id, o])=>{
      if(!knownOrderIds.has(id) && o.status === 'pending'){
        playDing();
        speakThai('มีออเดอร์ใหม่ โต๊ะ ' + o.table);
      }
    });
  }
  knownOrderIds = new Set(Object.keys(newOrders));
  orders = newOrders;
  renderOrders();
  firstLoad = false;
});

function timeAgo(ts){
  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if(diffMin < 1) return 'เมื่อสักครู่';
  if(diffMin < 60) return diffMin + ' นาทีที่แล้ว';
  return Math.floor(diffMin/60) + ' ชม.ที่แล้ว';
}

function renderFilters(){
  const counts = {pending:0, cooking:0, served:0, cancelled:0};
  Object.values(orders).forEach(o=>{ if(counts[o.status] !== undefined) counts[o.status]++; });
  const total = Object.keys(orders).length;
  const activeCount = counts.pending + counts.cooking;
  const defs = [
    {key:'active', label:'กำลังดำเนินการ', n:activeCount},
    {key:'pending', label:statusLabel.pending, n:counts.pending},
    {key:'cooking', label:statusLabel.cooking, n:counts.cooking},
    {key:'served', label:statusLabel.served, n:counts.served},
    {key:'cancelled', label:statusLabel.cancelled, n:counts.cancelled},
    {key:'all', label:'ทั้งหมด', n:total},
  ];
  const nav = document.getElementById('filters');
  nav.innerHTML = '';
  defs.forEach(d=>{
    const chip = document.createElement('div');
    chip.className = 'f-chip' + (activeFilter===d.key ? ' active' : '');
    chip.innerHTML = `${d.label}<span class="n">${d.n}</span>`;
    chip.onclick = ()=>{ activeFilter = d.key; renderOrders(); };
    nav.appendChild(chip);
  });
}

function renderOrders(){
  renderFilters();
  const list = document.getElementById('orderList');
  list.innerHTML = '';
  let entries = Object.entries(orders);
  entries = entries.filter(([id,o])=>{
    if(activeFilter === 'all') return true;
    if(activeFilter === 'active') return o.status === 'pending' || o.status === 'cooking';
    return o.status === activeFilter;
  });
  entries.sort((a,b)=> a[1].timestamp - b[1].timestamp);

  if(entries.length === 0){
    list.innerHTML = `<div class="empty"><div class="big">🍽️</div>ไม่มีออเดอร์ในหมวดนี้</div>`;
    return;
  }

  entries.forEach(([id, o])=>{
    const card = document.createElement('div');
    card.className = 'order-card st-' + o.status;
    const itemsHtml = (o.items||[]).map(it=>`
      <div class="item-row">
        <span><span class="qty">×${it.qty}</span><span class="name">${it.name}</span></span>
        <span class="price">${it.price * it.qty} บาท</span>
      </div>`).join('');

    let actionHtml = '', cancelHtml = '';
    if(o.status === 'pending'){
      actionHtml = `<button class="action-btn to-cooking" data-id="${id}" data-next="cooking">เริ่มทำ</button>`;
      cancelHtml = `<button class="cancel-btn" data-cancel="${id}">ยกเลิก</button>`;
    } else if(o.status === 'cooking'){
      actionHtml = `<button class="action-btn to-served" data-id="${id}" data-next="served">เสร็จแล้ว</button>`;
      cancelHtml = `<button class="cancel-btn" data-cancel="${id}">ยกเลิก</button>`;
    } else if(o.status === 'served'){
      actionHtml = `<button class="action-btn done" disabled>เสิร์ฟแล้ว ✓</button>`;
    } else if(o.status === 'cancelled'){
      actionHtml = `<button class="action-btn done" disabled>ยกเลิกแล้ว</button>`;
    } else {
      actionHtml = `<button class="action-btn done" disabled>${statusLabel[o.status] || o.status}</button>`;
    }

    card.innerHTML = `
      <div class="oc-top">
        <div class="table-tag">🪑 โต๊ะ ${o.table}</div>
        <div class="status-badge">${statusLabel[o.status] || o.status}</div>
      </div>
      <div class="time-tag">${timeAgo(o.timestamp)}</div>
      <div class="items-list">${itemsHtml}</div>
      <div class="oc-foot">
        <div class="total">รวม ${o.total} บาท</div>
        <div class="action-group">${cancelHtml}${actionHtml}</div>
      </div>`;
    list.appendChild(card);
  });

  list.querySelectorAll('[data-next]').forEach(btn=>{
    btn.onclick = ()=> db.ref('orders/' + btn.dataset.id + '/status').set(btn.dataset.next);
  });
  list.querySelectorAll('[data-cancel]').forEach(btn=>{
    btn.onclick = ()=>{
      if(confirm('ยกเลิกออเดอร์นี้ใช่ไหม?')) db.ref('orders/' + btn.dataset.cancel + '/status').set('cancelled');
    };
  });
}
setInterval(renderOrders, 30000);

// ================= MENU TAB =================
let menu = {};
let editingId = null;

db.ref('menu').on('value', snap=>{
  menu = snap.val() || {};
  renderMenu();
});

function renderMenu(){
  const list = document.getElementById('menuList');
  list.innerHTML = '';
  const entries = Object.entries(menu);
  if(entries.length === 0){
    list.innerHTML = `<div class="empty">ยังไม่มีเมนู กด "+ เพิ่มเมนู" เพื่อเริ่มเลยครับ</div>`;
    return;
  }
  const byCat = {};
  entries.forEach(([id,it])=>{
    const c = it.category || 'ไม่ระบุหมวดหมู่';
    if(!byCat[c]) byCat[c] = [];
    byCat[c].push([id,it]);
  });
  document.getElementById('catList').innerHTML = Object.keys(byCat).map(c=>`<option value="${c}">`).join('');

  Object.entries(byCat).forEach(([cat, items])=>{
    const group = document.createElement('div');
    group.className = 'cat-group';
    const profit = (it)=> (it.price||0) - (it.cost||0);
    group.innerHTML = `<div class="cat-title">${cat}</div>` + items.map(([id,it])=>`
      <div class="menu-item">
        ${it.image ? `<img class="mi-thumb" src="${it.image}">` : `<div class="mi-thumb">🍽️</div>`}
        <div class="mi-info">
          <div class="mi-name">${it.name}</div>
          <div class="mi-meta">
            <span>${it.price||0} บาท</span>
            <span class="mi-profit">กำไร ${profit(it)} บาท</span>
            ${it.stock !== undefined && it.stock !== null && it.stock !== '' ? `<span class="mi-stock ${it.stock<=3?'low':''}">สต็อก ${it.stock}</span>` : ''}
          </div>
        </div>
        <div class="mi-actions">
          <button class="avail-toggle ${it.available!==false?'on':'off'}" data-id="${id}" data-avail="${it.available!==false}">${it.available!==false?'กำลังขาย':'ของหมด'}</button>
          <button class="icon-btn" data-edit="${id}">✏️</button>
        </div>
      </div>`).join('');
    list.appendChild(group);
  });

  list.querySelectorAll('[data-edit]').forEach(btn=> btn.onclick = ()=> openForm(btn.dataset.edit));
  list.querySelectorAll('.avail-toggle').forEach(btn=>{
    btn.onclick = ()=> db.ref('menu/' + btn.dataset.id + '/available').set(btn.dataset.avail !== 'true');
  });
}

const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');

function openForm(id){
  editingId = id || null;
  const it = id ? menu[id] : {};
  document.getElementById('sheetTitle').textContent = id ? 'แก้ไขเมนู' : 'เพิ่มเมนูใหม่';
  document.getElementById('fName').value = it.name || '';
  document.getElementById('fCategory').value = it.category || '';
  document.getElementById('fCost').value = it.cost ?? '';
  document.getElementById('fPrice').value = it.price ?? '';
  document.getElementById('fStock').value = it.stock ?? '';
  document.getElementById('fImage').value = it.image || '';
  document.getElementById('deleteBtn').style.display = id ? 'block' : 'none';
  updateProfitPreview();
  overlay.classList.add('show');
  sheet.classList.add('show');
}
function closeForm(){
  overlay.classList.remove('show');
  sheet.classList.remove('show');
}
document.getElementById('addBtn').onclick = ()=> openForm(null);
document.getElementById('sheetClose').onclick = closeForm;
overlay.onclick = closeForm;

function updateProfitPreview(){
  const cost = parseFloat(document.getElementById('fCost').value) || 0;
  const price = parseFloat(document.getElementById('fPrice').value) || 0;
  document.getElementById('profitPreview').textContent = (price - cost) + ' บาท';
}
document.getElementById('fCost').oninput = updateProfitPreview;
document.getElementById('fPrice').oninput = updateProfitPreview;

document.getElementById('saveBtn').onclick = ()=>{
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCategory').value.trim() || 'ไม่ระบุหมวดหมู่';
  const cost = parseFloat(document.getElementById('fCost').value) || 0;
  const price = parseFloat(document.getElementById('fPrice').value) || 0;
  const stockRaw = document.getElementById('fStock').value;
  const stock = stockRaw === '' ? null : parseInt(stockRaw);
  const image = document.getElementById('fImage').value.trim();
  if(!name || !price){ alert('กรุณาใส่ชื่อเมนูและราคาขายอย่างน้อย'); return; }
  const data = { name, category, cost, price, stock, image, available: editingId ? (menu[editingId].available !== false) : true };
  const ref = editingId ? db.ref('menu/' + editingId) : db.ref('menu').push();
  ref.set(data).then(()=>{ closeForm(); showToast('บันทึกแล้ว 🎉'); }).catch(err=> alert('บันทึกไม่สำเร็จ: ' + err.message));
};
document.getElementById('deleteBtn').onclick = ()=>{
  if(!editingId) return;
  if(!confirm('ลบเมนูนี้ใช่ไหม?')) return;
  db.ref('menu/' + editingId).remove().then(()=>{ closeForm(); showToast('ลบแล้ว'); }).catch(err=> alert('ลบไม่สำเร็จ: ' + err.message));
};

// ================= SETTINGS TAB =================
db.ref('settings').on('value', snap=>{
  const s = snap.val() || {};
  document.getElementById('setOwnerName').value = s.ownerName || '';
  document.getElementById('setIdCard').value = s.idCard || '';
  document.getElementById('setShopName').value = s.shopName || '';
  document.getElementById('setAddress').value = s.address || '';
  document.getElementById('setPhone').value = s.phone || '';
  document.getElementById('setTaxId').value = s.taxId || '';
  document.getElementById('setFooter').value = s.footer || '';
});

document.getElementById('saveSettingsBtn').onclick = ()=>{
  const data = {
    ownerName: document.getElementById('setOwnerName').value.trim(),
    idCard: document.getElementById('setIdCard').value.trim(),
    shopName: document.getElementById('setShopName').value.trim(),
    address: document.getElementById('setAddress').value.trim(),
    phone: document.getElementById('setPhone').value.trim(),
    taxId: document.getElementById('setTaxId').value.trim(),
    footer: document.getElementById('setFooter').value.trim(),
  };
  db.ref('settings').set(data)
    .then(()=> showToast('บันทึกข้อมูลร้านแล้ว 🎉'))
    .catch(err=> alert('บันทึกไม่สำเร็จ: ' + err.message));
};

// ================= shared =================
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2000);
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>สั่งอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1712;
    --paper:#161311;
    --char:#242019;
    --char-2:#2e2820;
    --turmeric:#f0a93a;
    --turmeric-deep:#c97f1c;
    --chili:#e2492c;
    --leaf:#7a9a4a;
    --cream:#f3ead9;
    --line:#3a332a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--cream);
    font-family:'Sarabun',sans-serif;
    min-height:100vh;
    padding-bottom:96px;
  }
  header.top{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--paper) 70%,rgba(22,19,17,0));
    padding:18px 18px 10px;
  }
  .table-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--char);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px 6px 10px;
    font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;
    color:var(--turmeric);
  }
  .table-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--chili);}
  .call-bill-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:transparent;border:1px solid var(--line);color:var(--dim);
    font-family:'Kanit',sans-serif;font-weight:600;font-size:12.5px;
    padding:6px 12px;border-radius:999px;margin-left:8px;
  }
  .call-bill-btn:active{transform:scale(.95);}
  .call-bill-btn[disabled]{opacity:.5;}

  .member-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(122,154,74,.15);border:1px solid var(--leaf);color:#a9c97f;
    font-family:'Kanit',sans-serif;font-weight:600;font-size:12.5px;
    padding:6px 12px;border-radius:999px;margin-left:8px;
  }
  .stamp-progress{
    display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;
  }
  .stamp-dot{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    background:var(--char-2);border:1px solid var(--line);color:var(--dim);
  }
  .stamp-dot.filled{background:var(--turmeric);border-color:var(--turmeric);color:#241a06;}

  /* loyalty card widget (green branded design) */
  .loyalty-card{
    border-radius:20px;overflow:hidden;margin-bottom:16px;
    background:linear-gradient(135deg,#eaf3df,#cfe3b8);
    border:1px solid #a9c97f;
  }
  .loyalty-header{
    padding:16px 16px 10px;text-align:center;
    background:linear-gradient(135deg,#e4f0d8,#c3dea8);
  }
  .loyalty-shopname{
    font-family:'Kanit',sans-serif;font-weight:800;font-size:17px;color:#2e4a1f;margin-bottom:4px;
  }
  .loyalty-title{
    display:inline-block;background:#4c7a2e;color:#fff;
    font-family:'Kanit',sans-serif;font-weight:700;font-size:13.5px;
    padding:5px 16px;border-radius:999px;
  }
  .loyalty-sub{font-size:11.5px;color:#3f5c2e;margin-top:6px;}
  .loyalty-stamps-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
    padding:16px;
  }
  .loyalty-stamp{
    aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:#fff;border:2px solid #a9c97f;color:#5c7a45;
    font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;position:relative;
  }
  .loyalty-stamp.filled{background:#4c7a2e;border-color:#3f5c2e;color:#fff;}
  .loyalty-stamp .leaf{position:absolute;top:-4px;right:-2px;font-size:11px;}
  .loyalty-free-badge{
    margin:0 16px 16px;padding:14px;border-radius:16px;text-align:center;
    background:#2e4a1f;color:#fff;font-family:'Kanit',sans-serif;
  }
  .loyalty-free-badge .cup{font-size:26px;display:block;margin-bottom:2px;}
  .loyalty-free-badge b{font-size:15px;}
  .loyalty-footer{
    background:#2e4a1f;color:#cfe3b8;text-align:center;font-size:11px;padding:8px;
  }
  .member-form-field{margin-bottom:12px;}
  .member-form-field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-family:'Kanit',sans-serif;}
  .member-form-field input{
    width:100%;background:var(--char);border:1px solid var(--line);border-radius:10px;
    color:var(--cream);font-size:14.5px;padding:11px 12px;
  }
  .member-tab-row{display:flex;gap:8px;margin-bottom:16px;}
  .member-tab-btn{flex:1;font-family:'Kanit',sans-serif;font-weight:600;font-size:13px;padding:10px;border-radius:10px;background:var(--char);color:var(--dim);border:1px solid var(--line);}
  .member-tab-btn.active{background:var(--turmeric);color:#241a06;border-color:var(--turmeric);}
  .member-history-row{background:var(--char);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .member-history-date{color:var(--dim);font-size:11.5px;margin-bottom:3px;}
  .redeem-btn{
    width:100%;background:linear-gradient(135deg, var(--chili), var(--turmeric));color:#fff;border:none;
    font-family:'Kanit',sans-serif;font-weight:700;font-size:14px;padding:13px;border-radius:12px;margin-top:12px;
  }
  .feedback-note{
    background:var(--char-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--dim);margin-bottom:14px;
  }
  .feedback-textarea{
    width:100%;background:var(--char);border:1px solid var(--line);border-radius:10px;
    color:var(--cream);font-size:14px;padding:12px;min-height:110px;resize:vertical;font-family:'Sarabun',sans-serif;
  }
  .oos-notice-banner{
    position:fixed;top:70px;left:18px;right:18px;z-index:70;
    background:var(--chili);color:#fff;border-radius:14px;padding:14px 16px;
    font-family:'Kanit',sans-serif;font-weight:600;font-size:13.5px;
    display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .oos-notice-banner.show{display:block;}
  .oos-notice-banner button{
    margin-top:8px;background:#fff;color:var(--chili);border:none;font-family:'Kanit',sans-serif;font-weight:700;
    padding:6px 14px;border-radius:8px;font-size:12.5px;
  }
  h1.brand{
    font-family:'Kanit',sans-serif;font-weight:800;
    font-size:26px;margin:10px 0 2px;color:var(--cream);
    letter-spacing:.3px;
  }
  .promo-banner{
    display:none;
    margin:12px 18px 0;padding:12px 16px;border-radius:14px;
    background:linear-gradient(135deg, var(--chili), var(--turmeric));
    color:#fff;font-family:'Kanit',sans-serif;font-weight:700;font-size:14px;
    align-items:center;gap:10px;
  }
  .promo-banner.show{display:flex;}
  .promo-banner .icon{font-size:20px;flex:0 0 auto;}

  .promo-list-btn{
    display:none;width:calc(100% - 36px);margin:10px 18px 0;
    background:linear-gradient(135deg, var(--chili), var(--turmeric));
    color:#fff;border:none;border-radius:14px;padding:13px 16px;
    font-family:'Kanit',sans-serif;font-weight:700;font-size:14.5px;
    align-items:center;justify-content:space-between;
  }
  .promo-list-btn.show{display:flex;}
  .promo-list-btn .chev{font-size:13px;opacity:.85;}
  .sub{color:#9c9284;font-size:13px;margin:0;}

  nav.cats{
    display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex:0 0 auto;
    font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;
    padding:8px 16px;border-radius:999px;
    background:var(--char);color:#c9beac;
    border:1px solid var(--line);
    cursor:pointer;white-space:nowrap;
  }
  .cat-chip.active{
    background:var(--turmeric);color:#241a06;border-color:var(--turmeric);
  }

  main{padding:8px 18px 0;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
  .item-card{
    background:var(--char);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
    position:relative;
  }
  .item-img{
    width:100%;aspect-ratio:1/1;object-fit:cover;
    background:var(--char-2);display:block;
  }
  .item-img.placeholder{display:flex;align-items:center;justify-content:center;font-size:28px;}
  .sold-out-tag{
    position:absolute;top:8px;left:8px;
    background:rgba(20,17,14,.85);color:#c9beac;
    font-size:11px;font-family:'Kanit',sans-serif;
    padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  }
  .item-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .item-name{font-family:'Kanit',sans-serif;font-weight:600;font-size:14.5px;line-height:1.3;}
  .item-price{color:var(--turmeric);font-weight:700;font-family:'Kanit',sans-serif;font-size:15px;margin-top:auto;}
  .item-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;}

  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
    background:var(--char-2);color:var(--cream);font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper button:active{transform:scale(.92);}
  .stepper .qty{min-width:16px;text-align:center;font-family:'Kanit',sans-serif;font-weight:600;}

  .add-btn{
    background:var(--turmeric);color:#241a06;border:none;
    font-family:'Kanit',sans-serif;font-weight:700;font-size:13px;
    padding:7px 14px;border-radius:9px;
  }
  .add-btn:active{transform:scale(.96);}
  .add-btn[disabled]{background:var(--char-2);color:#6b6355;}

  .promo-sheet-card{
    background:var(--char);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .promo-sheet-info{flex:1;min-width:0;}
  .promo-sheet-name{font-family:'Kanit',sans-serif;font-weight:600;font-size:14.5px;}
  .promo-sheet-note{font-size:11.5px;color:var(--dim);margin-top:2px;}
  .promo-sheet-price{margin-top:4px;font-size:13px;}
  .promo-sheet-price .old{text-decoration:line-through;color:var(--dim);margin-right:6px;}
  .promo-sheet-price .new{color:var(--turmeric);font-weight:700;font-family:'Kanit',sans-serif;}

  /* cart bar */
  .cart-bar{
    position:fixed;left:14px;right:14px;bottom:14px;z-index:30;
    background:var(--chili);border-radius:18px;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    font-family:'Kanit',sans-serif;
    transform:translateY(120%);transition:transform .25s ease;
  }
  .cart-bar.show{transform:translateY(0);}
  .cart-bar .count{
    background:rgba(0,0,0,.25);border-radius:999px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;
  }
  .cart-bar .mid{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:14px;}
  .cart-bar .total{color:#fff;font-weight:800;font-size:16px;}

  /* cart sheet */
  .overlay{
    position:fixed;inset:0;background:rgba(10,8,6,.6);z-index:40;
    display:none;
  }
  .overlay.show{display:block;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--paper);border-radius:20px 20px 0 0;
    max-height:80vh;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .28s ease;
    border-top:1px solid var(--line);
  }
  .sheet.show{transform:translateY(0);}
  .sheet-head{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
  .sheet-head h2{font-family:'Kanit',sans-serif;font-size:17px;margin:0;}
  .sheet-close{background:none;border:none;color:#9c9284;font-size:20px;padding:4px;}
  .sheet-list{overflow-y:auto;padding:8px 18px;flex:1;}
  .cart-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .cart-row .name{flex:1;font-size:14px;}
  .cart-row .price{font-family:'Kanit',sans-serif;font-size:13px;color:#9c9284;}
  .sheet-foot{padding:14px 18px 18px;border-top:1px solid var(--line);}
  .sheet-total{display:flex;justify-content:space-between;font-family:'Kanit',sans-serif;font-weight:700;font-size:16px;margin-bottom:10px;}
  .confirm-btn{
    width:100%;background:var(--leaf);color:#12180a;border:none;
    font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;
    padding:14px;border-radius:12px;
  }
  .confirm-btn:active{transform:scale(.98);}
  .confirm-btn[disabled]{background:var(--char-2);color:#6b6355;}

  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-40px);
    background:var(--leaf);color:#12180a;font-family:'Kanit',sans-serif;font-weight:600;
    padding:10px 20px;border-radius:999px;font-size:13px;z-index:60;
    opacity:0;transition:all .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty-note{color:#9c9284;font-size:13px;text-align:center;padding:16px;}
</style>
</head>
<body>

<header class="top">
  <span class="table-badge"><span class="dot"></span><span id="tableLabel">โต๊ะ —</span></span>
  <button class="call-bill-btn" id="callBillBtn">🧾 เช็คบิล</button>
  <button class="call-bill-btn" id="memberBtn">👤 สมาชิก</button>
  <button class="call-bill-btn" id="feedbackBtn">💬 ติชม</button>
  <h1 class="brand">เมนูวันนี้</h1>
  <p class="sub">แตะเพื่อเพิ่มลงตะกร้า แล้วกดยืนยันสั่งอาหาร</p>
</header>

<div class="promo-banner" id="promoBanner">
  <span class="icon">📢</span>
  <span id="promoText"></span>
</div>

<button class="promo-list-btn" id="promoListBtn">
  <span>🔥 โปรโมชั่นวันนี้ (<span id="promoCount">0</span> รายการ)</span>
  <span class="chev">แตะเพื่อดู ▾</span>
</button>

<nav class="cats" id="catNav"></nav>

<main>
  <div class="grid" id="menuGrid"></div>
  <p class="empty-note" id="emptyNote" style="display:none;">ยังไม่มีเมนูในหมวดนี้</p>
</main>

<div class="cart-bar" id="cartBar">
  <div class="mid"><span class="count" id="cartCount">0</span> รายการในตะกร้า</div>
  <div class="total" id="cartTotalMini">0 บาท</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2>ตะกร้าของคุณ</h2>
    <button class="sheet-close" id="sheetClose">✕</button>
  </div>
  <div class="sheet-list" id="cartList"></div>
  <div class="sheet-foot">
    <div class="sheet-total"><span>รวมทั้งหมด</span><span id="cartTotalFull">0 บาท</span></div>
    <button class="confirm-btn" id="confirmBtn">ยืนยันสั่งอาหาร</button>
  </div>
</div>

<div class="toast" id="toast">ส่งออเดอร์เรียบร้อย 🎉</div>

<!-- promotions list sheet -->
<div class="overlay" id="overlayPromo"></div>
<div class="sheet" id="promoSheet">
  <div class="sheet-head">
    <h2>🔥 โปรโมชั่นวันนี้</h2>
    <button class="sheet-close" id="promoSheetClose">✕</button>
  </div>
  <div class="sheet-list" id="promoSheetList"></div>
</div>

<!-- member sheet -->
<div class="overlay" id="overlayMember"></div>
<div class="sheet" id="memberSheet">
  <div class="sheet-head">
    <h2>👤 สมาชิก</h2>
    <button class="sheet-close" id="memberSheetClose">✕</button>
  </div>
  <div class="sheet-list" id="memberSheetBody"></div>
</div>

<!-- feedback sheet -->
<div class="overlay" id="overlayFeedback"></div>
<div class="sheet" id="feedbackSheet">
  <div class="sheet-head">
    <h2>💬 คำติชม</h2>
    <button class="sheet-close" id="feedbackSheetClose">✕</button>
  </div>
  <div class="sheet-list">
    <div class="feedback-note">🔒 คำติชมของคุณไม่ระบุตัวตน ทางร้านจะไม่ทราบว่าใครเป็นผู้ส่ง แม้จะเป็นสมาชิกอยู่ก็ตาม</div>
    <textarea class="feedback-textarea" id="feedbackText" placeholder="บอกเราได้เลยว่าอยากให้ร้านปรับปรุงอะไร..."></textarea>
    <button class="confirm-btn" id="feedbackSubmitBtn" style="margin-top:12px;">ส่งคำติชม</button>
  </div>
</div>

<!-- out-of-stock notice banner -->
<div class="oos-notice-banner" id="oosBanner">
  <div id="oosBannerText"></div>
  <button id="oosBannerClose">รับทราบ</button>
</div>

<!-- ===================== Firebase ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
// วางค่า firebaseConfig ของโปรเจกต์คุณตรงนี้ (ได้จากขั้นตอน "ลงทะเบียนแอปเว็บ" ใน Firebase Console)
const firebaseConfig = {
  apiKey: "AIzaSyDAp28CroK5j_iE8LQXngUXXs1DaASqpE8",
  authDomain: "shop-order-system-62765.firebaseapp.com",
  databaseURL: "https://shop-order-system-62765-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shop-order-system-62765",
  storageBucket: "shop-order-system-62765.firebasestorage.app",
  messagingSenderId: "777357129637",
  appId: "1:777357129637:web:776e6c6dca05db99909a4c"
};
let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}catch(e){ console.warn("ยังไม่ได้ตั้งค่า Firebase:", e); }

// ===================== ข้อมูลตัวอย่าง (ใช้ตอนยังไม่เชื่อม Firebase) =====================
const sampleMenu = {
  item001:{name:"ส้มตำไทย",category:"ยำ/ส้มตำ",price:45,image:"",available:true},
  item002:{name:"ต้มยำกุ้ง",category:"ต้ม/แกง",price:80,image:"",available:true},
  item003:{name:"ข้าวผัดหมู",category:"จานเดียว",price:50,image:"",available:true},
  item004:{name:"ไก่ทอด",category:"ของทอด",price:60,image:"",available:false},
  item005:{name:"ชาเย็น",category:"เครื่องดื่ม",price:25,image:"",available:true},
  item006:{name:"น้ำมะนาว",category:"เครื่องดื่ม",price:20,image:"",available:true},
};

// ===================== state =====================
const params = new URLSearchParams(location.search);
const tableNo = params.get('table') || '—';
document.getElementById('tableLabel').textContent = 'โต๊ะ ' + tableNo;

document.getElementById('callBillBtn').onclick = ()=>{
  if(!db){
    alert('ยังไม่ได้เชื่อมต่อฐานข้อมูล');
    return;
  }
  const btn = document.getElementById('callBillBtn');
  btn.disabled = true;
  btn.textContent = '🧾 แจ้งแล้ว รอสักครู่';
  db.ref('billRequests').push({ table: tableNo, status: 'pending', timestamp: Date.now() })
    .then(()=>{
      setTimeout(()=>{ btn.disabled = false; btn.textContent = '🧾 เช็คบิล'; }, 60000);
    })
    .catch(err=>{
      alert('แจ้งไม่สำเร็จ: ' + err.message);
      btn.disabled = false;
      btn.textContent = '🧾 เช็คบิล';
    });
};

let menu = {};
let activeCat = 'ทั้งหมด';
let cart = {}; // itemId -> qty
let promotions = {};

function activePromoForItem(itemId){
  return Object.values(promotions).find(p => p.itemId === itemId && p.active !== false) || null;
}
function getEffectivePrice(id){
  const item = menu[id];
  if(!item) return 0;
  const promo = activePromoForItem(id);
  if(promo) return Math.max(0, item.price - promo.discount);
  return item.price;
}

function loadMenu(){
  if(db){
    db.ref('menu').on('value', snap=>{
      menu = snap.val() || {};
      if(Object.keys(menu).length === 0){ menu = sampleMenu; }
      renderCategories();
      renderMenu();
    });
  } else {
    menu = sampleMenu;
    renderCategories();
    renderMenu();
  }
}

function renderCategories(){

    nav.appendChild(chip);

}

  const grid = document.getElementById('menuGrid');

  grid.querySelectorAll('[data-act]').forEach(btn=>{

      if(btn.dataset.act === 'inc') cart[id] = (cart[id]||0) + 1;
      else { cart[id] = (cart[id]||0) - 1; if(cart[id]<=0) delete cart[id]; }
      renderMenu();
      updateCartBar();
    };
  });
}

function cartSubtotal(){
  return Object.entries(cart).reduce((sum,[id,qty])=> sum + getEffectivePrice(id)*qty, 0);
}

function activeBundlePromos(){
  return Object.values(promotions).filter(p=> p.type === 'bundle' && p.active !== false);
}

function bundleDiscountTotal(){
  let total = 0;
  activeBundlePromos().forEach(p=>{
    const qtyInSet = (p.itemIds||[]).reduce((sum,id)=> sum + (cart[id]||0), 0);
    const sets = Math.floor(qtyInSet / p.requiredCount);
    total += sets * p.discount;
  });
  return total;
}

function bundleDiscountBreakdown(){
  return activeBundlePromos().map(p=>{
    const qtyInSet = (p.itemIds||[]).reduce((sum,id)=> sum + (cart[id]||0), 0);
    const sets = Math.floor(qtyInSet / p.requiredCount);
    return { promo: p, sets, discount: sets * p.discount };
  }).filter(b=> b.sets > 0);
}

function cartTotal(){
  return Math.max(0, cartSubtotal() - bundleDiscountTotal());
}
function cartCount(){
  return Object.values(cart).reduce((a,b)=>a+b,0);
}

function updateCartBar(){
  const bar = document.getElementById('cartBar');
  const count = cartCount();
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotalMini').textContent = cartTotal() + ' บาท';
  bar.classList.toggle('show', count>0);
}

function renderCartList(){
  const list = document.getElementById('cartList');
  list.innerHTML = '';
  const entries = Object.entries(cart);
  if(entries.length === 0){
    list.innerHTML = '<p class="empty-note">ยังไม่ได้เลือกเมนู</p>';
  }
  entries.forEach(([id,qty])=>{
    const item = menu[id];
    if(!item) return;
    const row = document.createElement('div');
    row.className = 'cart-row';
    row.innerHTML = `
      <div class="stepper">
        <button data-act="dec" data-id="${id}">−</button>
        <span class="qty">${qty}</span>
        <button data-act="inc" data-id="${id}">+</button>
      </div>
      <div class="name">${item.name}</div>
      <div class="price">${getEffectivePrice(id) * qty} บาท</div>`;
    list.appendChild(row);
  });

  const bundles = bundleDiscountBreakdown();
  bundles.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'cart-row';
    row.style.color = 'var(--turmeric)';
    row.innerHTML = `
      <div style="flex:1;">🎁 ซื้อครบชุด x${b.sets} (${(b.promo.itemNames||[]).join(', ')})</div>
      <div class="price" style="color:var(--turmeric);">-${b.discount} บาท</div>`;
    list.appendChild(row);
  });

  if(freeRedeemItemId && menu[freeRedeemItemId]){
    const row = document.createElement('div');
    row.className = 'cart-row';
    row.style.color = 'var(--leaf)';
    row.innerHTML = `
      <div style="flex:1;">🎁 ${freeRedeemItemName} (คูปองฟรี)</div>
      <div class="price" style="color:var(--leaf);">0 บาท <button id="cancelFreeRedeem" style="margin-left:6px;background:none;border:none;color:var(--dim);">✕</button></div>`;
    list.appendChild(row);
  }

  list.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      if(btn.dataset.act === 'inc') cart[id] = (cart[id]||0) + 1;
      else { cart[id] = (cart[id]||0) - 1; if(cart[id]<=0) delete cart[id]; }
      renderCartList();
      renderMenu();
      updateCartBar();
      document.getElementById('cartTotalFull').textContent = cartTotal() + ' บาท';
    };
  });
  const cancelFreeBtn = document.getElementById('cancelFreeRedeem');
  if(cancelFreeBtn){
    cancelFreeBtn.onclick = (e)=>{
      e.stopPropagation();
      freeRedeemItemId = null;
      freeRedeemItemName = null;
      renderCartList();
    };
  }
  document.getElementById('cartTotalFull').textContent = cartTotal() + ' บาท';
}

document.getElementById('confirmBtn').onclick = ()=>{
  if(cartCount() === 0) return;
  const bundles = bundleDiscountBreakdown();
  const items = Object.entries(cart).map(([id,qty])=>({itemId:id, name:menu[id].name, price:getEffectivePrice(id), qty}));

  if(freeRedeemItemId && menu[freeRedeemItemId]){
    items.push({ itemId: freeRedeemItemId, name: menu[freeRedeemItemId].name + ' (ฟรี)', price: 0, qty: 1, isFreeRedeem: true });
  }

  const order = {
    table: tableNo,
    items,
    bundleDiscount: bundleDiscountTotal(),
    bundleDiscountNote: bundles.map(b=> `ซื้อครบชุด x${b.sets} (${(b.promo.itemNames||[]).join(', ')}) -${b.discount}`).join('; '),
    total: cartTotal(),
    status: 'pending',
    timestamp: Date.now()
  };
  if(memberId && memberData){
    order.memberId = memberId;
    order.memberNo = memberData.memberNo;
  }

  if(!db){
    alert('ยังไม่ได้เชื่อมต่อฐานข้อมูล (Firebase) — ออเดอร์นี้จะไม่ถูกบันทึก');
    return;
  }

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังส่ง...';

  db.ref('orders').push(order)
    .then((ref)=>{
      // track this order to watch for out-of-stock notices later
      watchedOrderIds.push(ref.key);
      sessionStorage.setItem('watchedOrderIds', JSON.stringify(watchedOrderIds));
      watchOrderForOos(ref.key);

      // update member stamp count
      if(memberId){
        let drinkQty = 0;
        Object.entries(cart).forEach(([id,qty])=>{
          if(menu[id] && isDrinkCategory(menu[id].category)) drinkQty += qty;
        });
        db.ref('members/' + memberId).transaction(m=>{
          if(!m) return m;
          m.stampCount = (m.stampCount || 0) + drinkQty;
          if(freeRedeemItemId) m.stampCount = Math.max(0, m.stampCount - 10);
          return m;
        });
      }

      freeRedeemItemId = null;
      freeRedeemItemName = null;
      cart = {};
      closeSheet();
      renderMenu();
      updateCartBar();
      showToast();
    })
    .catch((err)=>{
      alert('ส่งออเดอร์ไม่สำเร็จ: ' + err.message);
    })
    .finally(()=>{
      btn.disabled = false;
      btn.textContent = 'ยืนยันสั่งอาหาร';
    });
};

  return DRINK_CATEGORY_HINTS.some(hint=> cat.includes(hint));
}

function renderMemberDashboard(body){
  const stamps = memberData.stampCount || 0;
  const filled = stamps % 10;
  const canRedeem = stamps >= 10;
  const shopName = shopSettings.shopName || 'ร้านค้า';
  const shopPhone = shopSettings.phone || '';

  let stampsHtml = '';
  for(let i=1;i<=10;i++){
    const isFilled = i <= filled;
    stampsHtml += `<div class="loyalty-stamp ${isFilled ? 'filled' : ''}">${isFilled ? '🍃' : i}</div>`;

  const loyaltyCardHtml = `
    <div class="loyalty-card">

      ${canRedeem
        ? `<div class="loyalty-free-badge"><span class="cup">🥤</span><b>ครบแล้ว! กดรับคูปองด้านล่าง</b></div>`
        : `<div class="loyalty-free-badge" style="background:#3f5c2e;"><b>สะสมแล้ว ${filled}/10 แก้ว</b></div>`}
      ${shopPhone ? `<div class="loyalty-footer">📞 ${shopPhone}</div>` : ''}
    </div>
  `;

  body.innerHTML = `
    <div class="member-form-field">
      <div style="font-family:'Kanit',sans-serif;font-weight:700;font-size:16px;">${memberData.name}</div>
      <div style="color:var(--dim);font-size:12.5px;">สมาชิกเลขที่ #${String(memberData.memberNo).padStart(4,'0')}</div>
    </div>
    ${loyaltyCardHtml}
    ${canRedeem ? `<button class="redeem-btn" id="redeemBtn">🎁 ใช้คูปองน้ำปั่น 1 แก้วฟรี</button>` : ''}
    ${freeRedeemItemId ? `<div style="margin-top:10px;padding:10px;background:var(--char-2);border-radius:10px;font-size:13px;color:var(--turmeric);">✅ เลือก "${freeRedeemItemName}" ฟรีไว้ในตะกร้าแล้ว</div>` : ''}
    <div id="redeemPickerArea"></div>
    <div class="section-title" style="font-family:'Kanit',sans-serif;font-weight:700;font-size:13px;color:var(--dim);margin:18px 0 8px;">ประวัติการสั่งของคุณ</div>
    <div id="memberHistoryList"><div class="empty-note">กำลังโหลด...</div></div>
  `;

  if(canRedeem && !freeRedeemItemId){
    document.getElementById('redeemBtn').onclick = ()=>{
      const eligible = Object.entries(menu).filter(([id,it])=> isDrinkCategory(it.category) && it.available !== false);
      const area = document.getElementById('redeemPickerArea');
      if(eligible.length === 0){
        area.innerHTML = `<div class="empty-note">ตอนนี้ไม่มีเมนูที่ร่วมรายการ</div>`;
        return;
      }
      area.innerHTML = eligible.map(([id,it])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed var(--line);">

        histEl.innerHTML = `<div class="empty-note">ยังไม่มีประวัติการสั่ง</div>`;
        return;
      }
      histEl.innerHTML = list.map(o=>{
        const d = new Date(o.timestamp).toLocaleDateString('th-TH');
        const itemsStr = (o.items||[]).map(it=> it.name+' x'+it.qty).join(', ');
        return `<div class="member-history-row"><div class="member-history-date">${d}</div>${itemsStr}<div style="margin-top:4px;color:var(--turmeric);font-family:'Kanit',sans-serif;font-weight:600;">${o.total} บาท</div></div>`;
      }).join('');
    });
}

// ================= FEEDBACK =================
const overlayFeedback = document.getElementById('overlayFeedback');
const feedbackSheetEl = document.getElementById('feedbackSheet');
document.getElementById('feedbackBtn').onclick = ()=>{
  document.getElementById('feedbackText').value = '';
  overlayFeedback.classList.add('show');
  feedbackSheetEl.classList.add('show');
};
document.getElementById('feedbackSheetClose').onclick = ()=>{
  overlayFeedback.classList.remove('show');
  feedbackSheetEl.classList.remove('show');
};
overlayFeedback.onclick = ()=>{
  overlayFeedback.classList.remove('show');
  feedbackSheetEl.classList.remove('show');
};
document.getElementById('feedbackSubmitBtn').onclick = ()=>{
  const msg = document.getElementById('feedbackText').value.trim();
  if(!msg){ alert('กรุณาพิมพ์ข้อความก่อน'); return; }
  if(!db){ alert('ยังไม่ได้เชื่อมต่อฐานข้อมูล'); return; }
  db.ref('feedback').push({ message: msg, timestamp: Date.now() })
    .then(()=>{
      overlayFeedback.classList.remove('show');
      feedbackSheetEl.classList.remove('show');
      showToast('ขอบคุณสำหรับคำติชม 🙏');
    })
    .catch(err=> alert('ส่งไม่สำเร็จ: ' + err.message));
};

// ================= OUT-OF-STOCK NOTICE (for orders placed this session) =================
let watchedOrderIds = JSON.parse(sessionStorage.getItem('watchedOrderIds') || '[]');
let seenOosNotices = JSON.parse(sessionStorage.getItem('seenOosNotices') || '[]');

function watchOrderForOos(orderId){
  if(!db) return;
  db.ref('orders/' + orderId).on('value', snap=>{
    const o = snap.val();
    if(o && o.oosNotice && !seenOosNotices.includes(orderId + ':' + o.oosNotice)){
      showOosBanner(o.oosNotice);
      seenOosNotices.push(orderId + ':' + o.oosNotice);
      sessionStorage.setItem('seenOosNotices', JSON.stringify(seenOosNotices));
    }
  });
}
watchedOrderIds.forEach(watchOrderForOos);

function showOosBanner(text){
  document.getElementById('oosBannerText').textContent = '⚠️ ' + text;
  document.getElementById('oosBanner').classList.add('show');
}
document.getElementById('oosBannerClose').onclick = ()=>{
  document.getElementById('oosBanner').classList.remove('show');
};
</script>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>แคชเชียร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1712; --paper:#161311; --char:#242019; --char-2:#2e2820;
    --turmeric:#f0a93a; --chili:#e2492c; --leaf:#7a9a4a;
    --cream:#f3ead9; --line:#3a332a; --dim:#9c9284;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--cream);font-family:'Sarabun',sans-serif;min-height:100vh;}
  header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 18px 12px;}
  h1{font-family:'Kanit',sans-serif;font-weight:800;font-size:22px;margin:0 0 2px;}
  .sub{color:var(--dim);font-size:12.5px;margin:0;display:flex;align-items:center;gap:6px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:inline-block;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  main{padding:14px 18px;display:flex;flex-direction:column;gap:12px;}
  .table-card{
    background:var(--char);border:1px solid var(--line);border-radius:16px;
    padding:16px;display:flex;justify-content:space-between;align-items:center;
  }
  .tc-left{display:flex;flex-direction:column;gap:4px;}
  .tc-name{font-family:'Kanit',sans-serif;font-weight:700;font-size:17px;color:var(--turmeric);}
  .tc-meta{font-size:12.5px;color:var(--dim);}
  .tc-total{font-family:'Kanit',sans-serif;font-weight:800;font-size:19px;}
  .pay-btn{
    font-family:'Kanit',sans-serif;font-weight:700;font-size:13.5px;
    background:var(--leaf);color:#12180a;border:none;padding:10px 16px;border-radius:10px;
  }
  .pay-btn:active{transform:scale(.96);}

  .empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;}
  .empty .big{font-size:34px;margin-bottom:8px;}

  /* bill sheet */
  .overlay{position:fixed;inset:0;background:rgba(10,8,6,.65);z-index:40;display:none;}
  .overlay.show{display:block;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
    border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .28s ease;border-top:1px solid var(--line);
  }
  .sheet.show{transform:translateY(0);}
  .sheet-head{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
  .sheet-head h2{font-family:'Kanit',sans-serif;font-size:17px;margin:0;}
  .sheet-close{background:none;border:none;color:var(--dim);font-size:20px;padding:4px;}
  .sheet-body{overflow-y:auto;padding:14px 18px;flex:1;}

  .bill-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .bill-row .name{flex:1;}
  .bill-total-row{
    display:flex;justify-content:space-between;font-family:'Kanit',sans-serif;
    font-weight:800;font-size:19px;padding-top:12px;margin-top:6px;color:var(--turmeric);
  }

  .cash-section{margin-top:18px;}
  .cash-label{font-family:'Kanit',sans-serif;font-weight:600;font-size:13.5px;color:var(--dim);margin-bottom:8px;}
  .cash-input{
    width:100%;background:var(--char);border:1px solid var(--line);border-radius:12px;
    color:var(--cream);font-family:'Kanit',sans-serif;font-size:22px;font-weight:700;
    padding:12px 14px;text-align:right;margin-bottom:10px;
  }
  .quick-cash{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .qc-btn{
    font-family:'Kanit',sans-serif;font-weight:600;font-size:13px;
    background:var(--char-2);color:var(--cream);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;
  }
  .qc-btn:active{transform:scale(.94);}

  .change-box{
    background:var(--char);border-radius:12px;padding:14px;display:flex;
    justify-content:space-between;align-items:center;margin-bottom:16px;
  }
  .change-box .lbl{font-size:13px;color:var(--dim);}
  .change-box .val{font-family:'Kanit',sans-serif;font-weight:800;font-size:22px;}
  .change-box .val.neg{color:var(--chili);}
  .change-box .val.pos{color:var(--leaf);}

  .confirm-btn{
    width:100%;background:var(--leaf);color:#12180a;border:none;
    font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;
    padding:15px;border-radius:12px;margin-bottom:14px;
  }
  .confirm-btn:active{transform:scale(.98);}
  .confirm-btn[disabled]{background:var(--char-2);color:var(--dim);}

  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-40px);
    background:var(--leaf);color:#12180a;font-family:'Kanit',sans-serif;font-weight:600;
    padding:10px 20px;border-radius:999px;font-size:13px;z-index:60;
    opacity:0;transition:all .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>แคชเชียร์</h1>
  <p class="sub"><span class="live-dot"></span> โต๊ะที่ยังไม่เก็บเงิน — อัปเดตเรียลไทม์</p>
</header>

<main id="tableList"></main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2 id="sheetTitle">บิลโต๊ะ</h2>
    <button class="sheet-close" id="sheetClose">✕</button>
  </div>
  <div class="sheet-body">
    <div id="billItems"></div>
    <div class="bill-total-row"><span>ยอดรวมทั้งหมด</span><span id="billTotal">0 บาท</span></div>

    <div class="cash-section">
      <div class="cash-label">รับเงินมา</div>
      <input type="number" inputmode="numeric" class="cash-input" id="cashInput" placeholder="0">
      <div class="quick-cash" id="quickCash"></div>
      <div class="change-box">
        <span class="lbl">เงินทอน</span>
        <span class="val" id="changeVal">0 บาท</span>
      </div>
      <button class="confirm-btn" id="confirmPayBtn">ยืนยันรับเงิน & ปิดโต๊ะ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">ปิดโต๊ะเรียบร้อย 🎉</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDAp28CroK5j_iE8LQXngUXXs1DaASqpE8",
  authDomain: "shop-order-system-62765.firebaseapp.com",
  databaseURL: "https://shop-order-system-62765-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shop-order-system-62765",
  storageBucket: "shop-order-system-62765.firebasestorage.app",
  messagingSenderId: "777357129637",
  appId: "1:777357129637:web:776e6c6dca05db99909a4c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let orders = {};
let currentTable = null;
let currentOrderIds = [];
let currentBillTotal = 0;

db.ref('orders').on('value', snap=>{
  orders = snap.val() || {};
  render();
});

function groupByTable(){
  const groups = {};
  Object.entries(orders).forEach(([id,o])=>{
    if(o.status === 'paid') return; // already settled
    const t = o.table;
    if(!groups[t]) groups[t] = { orderIds:[], items:[], total:0, count:0 };
    groups[t].orderIds.push(id);
    groups[t].total += (o.total || 0);
    groups[t].count += 1;
    (o.items||[]).forEach(it=>{
      const existing = groups[t].items.find(x=>x.itemId===it.itemId);
      if(existing) existing.qty += it.qty;
      else groups[t].items.push({...it});
    });
  });
  return groups;
}

function render(){
  const groups = groupByTable();
  const list = document.getElementById('tableList');
  list.innerHTML = '';
  const tables = Object.keys(groups).sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));

  if(tables.length === 0){
    list.innerHTML = `<div class="empty"><div class="big">💰</div>ไม่มีโต๊ะค้างชำระตอนนี้</div>`;
    return;
  }

  tables.forEach(t=>{
    const g = groups[t];
    const card = document.createElement('div');
    card.className = 'table-card';
    card.innerHTML = `
      <div class="tc-left">
        <div class="tc-name">🪑 โต๊ะ ${t}</div>
        <div class="tc-meta">${g.count} ออเดอร์ · ${g.items.length} รายการ</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="tc-total">${g.total} บาท</div>
        <button class="pay-btn" data-table="${t}">เก็บเงิน</button>
      </div>`;
    list.appendChild(card);
  });

  list.querySelectorAll('.pay-btn').forEach(btn=>{
    btn.onclick = ()=> openBill(btn.dataset.table, groups[btn.dataset.table]);
  });
}

function openBill(table, group){
  currentTable = table;
  currentOrderIds = group.orderIds;
  currentBillTotal = group.total;

  document.getElementById('sheetTitle').textContent = 'บิลโต๊ะ ' + table;
  const itemsHtml = group.items.map(it=>`
    <div class="bill-row">
      <span class="name">${it.name} ×${it.qty}</span>
      <span>${it.price * it.qty} บาท</span>
    </div>`).join('');
  document.getElementById('billItems').innerHTML = itemsHtml;
  document.getElementById('billTotal').textContent = group.total + ' บาท';

  const cashInput = document.getElementById('cashInput');
  cashInput.value = '';
  updateChange();

  const quick = document.getElementById('quickCash');
  const roundUp = (n, step)=> Math.ceil(n/step)*step;
  const suggestions = [group.total, roundUp(group.total,20), roundUp(group.total,100), roundUp(group.total,500), roundUp(group.total,1000)];
  const uniqueSug = [...new Set(suggestions)].slice(0,5);
  quick.innerHTML = uniqueSug.map(v=>`<button class="qc-btn" data-v="${v}">${v}</button>`).join('');
  quick.querySelectorAll('.qc-btn').forEach(b=>{
    b.onclick = ()=>{ cashInput.value = b.dataset.v; updateChange(); };
  });

  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function closeBill(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
document.getElementById('sheetClose').onclick = closeBill;
document.getElementById('overlay').onclick = closeBill;

document.getElementById('cashInput').oninput = updateChange;

function updateChange(){
  const cash = parseFloat(document.getElementById('cashInput').value) || 0;
  const change = cash - currentBillTotal;
  const el = document.getElementById('changeVal');
  el.textContent = Math.abs(change).toLocaleString() + ' บาท' + (change < 0 ? ' (ขาด)' : '');
  el.className = 'val ' + (change < 0 ? 'neg' : 'pos');

  const btn = document.getElementById('confirmPayBtn');
  btn.disabled = cash < currentBillTotal;
}

document.getElementById('confirmPayBtn').onclick = ()=>{
  const updates = {};
  currentOrderIds.forEach(id=>{ updates['orders/' + id + '/status'] = 'paid'; });
  db.ref().update(updates)
    .then(()=>{
      closeBill();
      showToast();
    })
    .catch(err=>{
      alert('ปิดโต๊ะไม่สำเร็จ: ' + err.message);
    });
};

function showToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
